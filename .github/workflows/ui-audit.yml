name: UI screenshot audit

on:
  push:
    branches: [chore/ui-audit-20260920]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/isekai-preview.log 2>&1 &
          echo $! > /tmp/isekai-preview.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/isekai-preview.log
          exit 1
      - name: Locate Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome not found on runner" >&2
            exit 1
          fi
          google-chrome --version || chromium-browser --version || chromium --version || true
      - name: Capture UI screenshots
        env:
          AUDIT_URL: http://127.0.0.1:4173
        run: node scripts/ui-audit.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: ui-audit/
          if-no-files-found: error
          retention-days: 3
